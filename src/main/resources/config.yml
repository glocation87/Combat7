# All times are in ticks, 20 ticks = 1 second

parry:
  # how long a right click keeps you parrying
  window-ticks: 6
  cooldown-ticks: 20
  # how long a parried attacker can't deal melee damage
  stagger-ticks: 20
  knockback: 0.7
  # how far off center (either side) an attacker can be and still get parried
  arc-degrees: 75

dash:
  # max gap between the two taps
  double-tap-ticks: 6
  cooldown-ticks: 24
  speed: 1.1
  lift: 0.25
  # the start of a dash where hits miss you
  dodge-ticks: 5
  # max clones per dash, they only spawn while you're still moving faster than a sprint
  after-images: 12
  # clones per tick, filled in evenly along the path like extra frames
  after-image-frames: 3
  # how long the first clone lasts, the rest vanish one per tick after it
  after-image-ticks: 8

clash:
  # two hits landing this close together count as swords colliding
  window-ticks: 4
  knockback: 0.35

shield:
  arc-degrees: 90

ui:
  # floating damage numbers over whoever you hit, crits always show
  damage-numbers: true
  # max gap between hits before a combo drops
  combo-window-ticks: 40
